name: images
on:
  workflow_dispatch:
    inputs:
      image:
        description: folder under images/ to build (or all)
        default: all
  push:
    paths: ["images/**", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: pick
        run: |
          all=$(ls images | jq -R . | jq -sc .)
          want="${{ github.event.inputs.image }}"
          if [ -n "$want" ] && [ "$want" != all ]; then echo "list=[\"$want\"]" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "${{ github.event_name }}" = push ] && git rev-parse HEAD~1 >/dev/null 2>&1; then
            ch=$(git diff --name-only HEAD~1 HEAD | grep -E '^images/[^/]+/' | cut -d/ -f2 | sort -u | jq -R . | jq -sc .)
            if git diff --name-only HEAD~1 HEAD | grep -q '^.github/workflows/'; then ch=$all; fi
            [ "$ch" = "[]" ] && ch=$all
            echo "list=$ch" >> $GITHUB_OUTPUT
          else
            echo "list=$all" >> $GITHUB_OUTPUT
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.changes.outputs.list) }}
    steps:
      - name: make room (docker on the big /mnt disk)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vgpu-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/vgpu-${{ matrix.image }}:${{ github.sha }}
      - name: size
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head
