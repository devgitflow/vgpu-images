name: images
on:
  workflow_dispatch:
    inputs:
      image:
        description: folder under images/ to build (or all)
        default: all
  push:
    paths: ["images/**", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [rust-cuda, torch]
    steps:
      - name: skip if not selected
        id: sel
        run: |
          want="${{ github.event.inputs.image || 'all' }}"
          if [ "$want" = all ] || [ "$want" = "${{ matrix.image }}" ]; then echo go=1 >> $GITHUB_OUTPUT; fi
      - name: free disk
        if: steps.sel.outputs.go
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
        if: steps.sel.outputs.go
      - uses: docker/login-action@v3
        if: steps.sel.outputs.go
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.sel.outputs.go
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vgpu-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/vgpu-${{ matrix.image }}:${{ github.sha }}
